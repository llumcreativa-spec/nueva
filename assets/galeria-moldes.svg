  <rect width="900" height="620" fill="url(#bg)"/>
  <rect width="900" height="620" fill="url(#grid)"/>
  <circle cx="760" cy="100" r="180" fill="#2a6db0" opacity="0.18"/>
  <circle cx="120" cy="520" r="150" fill="#2a6db0" opacity="0.14"/>
  <g filter="url(#shadow)">
    <rect x="120" y="120" width="660" height="360" rx="28" fill="#171b20" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect x="160" y="170" width="290" height="190" rx="14" fill="url(#metal)" opacity="0.82"/>
    <rect x="485" y="170" width="230" height="190" rx="14" fill="#2a6db0" opacity="0.72"/>
    <path d="M190 405H710" stroke="#dce4ee" stroke-opacity="0.55" stroke-width="18" stroke-linecap="round"/>
    <path d="M210 405H360M430 405H580M630 405H690" stroke="#101418" stroke-opacity="0.55" stroke-width="8" stroke-linecap="round"/>
    <g stroke="#ffffff" stroke-opacity="0.35" stroke-width="10" fill="none" stroke-linecap="round">
      <path d="M220 250h170"/>
      <path d="M535 250h130"/>
      <path d="M535 295h100"/>
